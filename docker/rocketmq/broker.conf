# RocketMQ Broker 配置（Docker 容器版）
# 挂载到 apache/rocketmq:5.3.2 镜像内 /home/rocketmq/rocketmq-5.3.2/conf/broker.conf
# brokerIP1=127.0.0.1：后端跑在宿主机，通过 127.0.0.1:10911 端口映射直连 broker；
# 免去宿主机局域网 IP（DHCP 换网会变）的维护成本。若将来后端容器化需改为宿主机可达 IP。

# 集群
brokerClusterName=DefaultCluster
brokerName=broker-a
brokerId=0

# 客户端直连地址（宿主机可达视角）
brokerIP1=127.0.0.1

# 存储
storePathRootDir=/home/rocketmq/store
storePathCommitLog=/home/rocketmq/store/commitlog

# 日志清理
deleteWhen=04
fileReservedTime=48

# 主从与刷盘策略
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH

# 开发便利：自动创建 Topic
autoCreateTopicEnable=true