table-cell; white-space: nowrap; line-height: 1.5; max-width: 560px; text-align: center;"><span class="nodeLabel"><p>在线写入链路<br />商城后端行为上报<br />流式计算作业产出特征</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-R1-1" data-look="classic" transform="translate(651.3984375, 339)"><rect class="basic label-container" style="" x="-180.6640625" y="-135" width="361.328125" height="270"/><g class="label" style="" transform="translate(-150.6640625, -120)"><rect/><foreignObject width="301.328125" height="240"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 560px; text-align: center;"><span class="nodeLabel"><p>内存库 · 在线层<br />用户偏好特征（类目偏好分 · 品牌偏好分）<br />特征元信息（最近事件时间 · 计算时间）<br />商品热度榜<br />类目候选索引<br />商品可售状态<br />过滤清单<br />榜单快照<br />上报去重标识<br />配置副本</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-W2-2" data-look="classic" transform="translate(1051.1953125, 71)"><rect class="basic label-container" style="" x="-78" y="-63" width="156" height="126"/><g class="label" style="" transform="translate(-48, -48)"><rect/><foreignObject width="96" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 560px; text-align: center;"><span class="nodeLabel"><p>定时写入链路<br />画像生成任务<br />热度快照任务<br />指标统计任务</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-M1-3" data-look="classic" transform="translate(1051.1953125, 339)"><rect class="basic label-container" style="" x="-164.1328125" y="-111" width="328.265625" height="222"/><g class="label" style="" transform="translate(-134.1328125, -96)"><rect/><foreignObject width="268.265625" height="192"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 560px; text-align: center;"><span class="nodeLabel"><p>MySQL 8 推荐库<br />t_user_behavior_log 行为明细与回放<br />t_user_profile 用户画像历史版本<br />t_item_hot_score 商品热度分快照<br />t_rec_config 策略配置项<br />t_rec_fixed_slot 固定坑位配置<br />t_rec_filter_rule 过滤规则<br />t_pipeline_metric 链路指标</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-S1-4" data-look="classic" transform="translate(211.8671875, 339)"><rect class="basic label-container" style="" x="-203.8671875" y="-87" width="407.734375" height="174"/><g class="label" style="" transform="translate(-173.8671875, -72)"><rect/><foreignObject width="347.734375" height="144"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 560px; text-align: center;"><span class="nodeLabel"><p>商城业务库 只读依赖<br />product 商品与二级类目 · 品牌标识 · 上下架状态<br />sku 规格与库存<br />category 一级 / 二级类目层级<br />brand 品牌主数据（品牌标识 · 品牌名）<br />user 账号状态</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-V1-5" data-look="classic" transform="translate(651.3984375, 619)"><rect class="basic label-container" style="" x="-102" y="-75" width="204" height="150"/><g class="label" style="" transform="translate(-72, -60)"><rect/><foreignObject width="144" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 560px; text-align: center;"><span class="nodeLabel"><p>在线读取方<br />召回模块<br />融合与过滤模块<br />重排与固定坑位模块<br />榜单查询服务</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#2f5496" stop-opacity="1"/><stop offset=