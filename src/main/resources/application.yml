spring:
  application:
    name: shop

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    url: jdbc:mysql://localhost:3306/shop?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      # 连接池参数
      initial-size: 5                 # 启动预建连接
      min-idle: 5                     # 最小空闲连接
      max-active: 20                  # 最大连接数（并发 SQL 上限，防打垮数据库）
      max-wait: 60000                 # 借连接最长等待 60s，超时抛异常
      # 连接保活检测
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      # 监控过滤器
      filter:
        stat:                          # SQL 统计：参数化指纹聚合 + 慢 SQL 日志
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 2000        # 超过 2s 的 SQL 打印 WARN 日志
        wall:                          # SQL 防火墙：解析 AST 拦截 1=1 注入 / 无 WHERE 删除等
          enabled: true
      # 监控面板（访问 /druid/）
      stat-view-servlet:
        enabled: true
        login-username: ${DRUID_MONITOR_USER:admin}
        login-password: ${DRUID_MONITOR_PASSWORD}   # 必须通过 .env 注入，无默认值（未配置则启动失败，防呆）
        reset-enable: false            # 禁止在面板上清空统计数据
      # Web 请求统计
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
      password: ${REDIS_PASSWORD:}

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  web:
    resources:
      add-mappings: false            # 关闭默认静态资源映射（Nginx 托管前端静态文件）
  mvc:
    throw-exception-if-no-handler-found: true   # 无匹配 Handler 时抛异常而非回退到静态资源

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.shop.model.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8080

sa-token:
  token-name: token
  # 会话存储介质：memory=JVM 内存（默认，单机可用）；redis=Redis 存储（分布式会话共享，
  # 多实例部署时登录态/强制下线跨实例生效；序列化走 sa-token-jackson，对象以 JSON 存 String 键）
  dao-type: redis
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false

# RocketMQ 配置（NameServer 地址由 .env 传入，默认本地 9876）
rocketmq:
  name-server: ${ROCKETMQ_NAMESRV:127.0.0.1:9876}
  producer:
    group: shop-producer-group

rag:
  qdrant:
    host: localhost
    port: 6334
    collection-name: products
    dimension: 1536
  llm:
    api-key: ${DASHSCOPE_API_KEY}
    # 对话模型 key：优先 DEEPSEEK_API_KEY，未配回退 rag.llm.api-key（保证测试/未配置环境上下文可加载）
    chat-api-key: ${DEEPSEEK_API_KEY:${rag.llm.api-key}}
    chat-model: deepseek-chat
    embedding-model: text-embedding-v1
