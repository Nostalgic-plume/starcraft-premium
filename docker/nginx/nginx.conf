# Shop 电商系统 — Nginx Docker 版主配置
# 挂载覆盖容器默认 /etc/nginx/nginx.conf（替代本地 D:/software/nginx-1.20.2/conf/nginx.conf）
# 与本地版差异：① 反代后端 localhost:8080 → host.docker.internal:8080（容器内 localhost 是容器自身）
#               ② 三端静态路径 → 容器内 /usr/share/nginx/html/{user,admin,merchant}
#               ③ 日志路径 → /var/log/nginx/（容器标准路径）
# 访问地址不变：http://localhost / http://localhost/admin/ / http://localhost/merchant/

user nginx;
worker_processes  2;

events {
    worker_connections  2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout  65;

    # ====== Gzip 压缩 ======
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml;
    gzip_vary on;
    gzip_proxied any;

    # ====== 文件上传大小限制 ======
    client_max_body_size 20m;

    # ====== 日志格式 ======
    log_format main '$remote_addr [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log  warn;

    # ====== 后端 API 负载均衡池（容器内经 host.docker.internal 访问宿主机后端 :8080）======
    upstream backend {
        server host.docker.internal:8080 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen       80;
        server_name  localhost;

        # ====== API 反向代理 ======
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";                    # 保持长连接

            # 基础代理头
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 透传自定义 Header（前端 Token 通过此 header 传递）
            proxy_pass_header token;
            proxy_pass_header Authorization;

            # 超时设置
            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;

            # 缓冲
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 8 8k;

            # CORS 跨域头（后端有 GlobalExceptionHandler，Nginx 层兜底）
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "token, Authorization, Content-Type, X-Requested-With" always;
            add_header Access-Control-Allow-Credentials true always;

            # 预检请求直接返回 204
            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        # ====== Swagger / API 文档 ======
        location /swagger-ui.html {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /api-docs {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ====== 管理后台前端 ======
        location /admin/ {
            alias /usr/share/nginx/html/admin/;
            index index.html;
            try_files $uri $uri/ /admin/index.html;
            add_header Cache-Control "no-cache, must-revalidate";

            # 静态资源缓存（HTML 不缓存，JS/CSS/图片强缓存）
            location ~* /admin/assets/ {
                expires 7d;
                add_header Cache-Control "public, immutable";
            }
        }

        # ====== 商家中心前端 ======
        location /merchant/ {
            alias /usr/share/nginx/html/merchant/;
            index index.html;
            try_files $uri $uri/ /merchant/index.html;
            add_header Cache-Control "no-cache, must-revalidate";

            location ~* /merchant/assets/ {
                expires 7d;
                add_header Cache-Control "public, immutable";
            }
        }

        # ====== 用户端 SPA ======
        location / {
            root /usr/share/nginx/html/user;
            index index.html;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, must-revalidate";

            location ~* /assets/ {
                expires 7d;
                add_header Cache-Control "public, immutable";
            }
        }

        # ====== 错误页 ======
        error_page 500 502 503 504 /50x.html;
        location = /50x.html { root /usr/share/nginx/html; }

        # ====== 禁止访问敏感文件 ======
        location ~ /\.(git|env|svn|htaccess) {
            deny all;
        }
    }
}