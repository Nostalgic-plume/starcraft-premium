# 中间件 Docker Compose 编排（按 profile 分组，按需启动以控制内存占用）
#
# 默认启动（docker compose up -d）：Redis / RocketMQ / Nginx —— 商城核心运行必需
#
# 可选分组（默认不启动，用 --profile 显式启用）：
#   --profile rec   → Kafka（行为事件流，KRaft 单节点）+ Flink（实时计算集群，JM 1G + TM 2G）
#   --profile rag   → Qdrant（RAG 向量库）
#   --profile gpu   → TEI（本地 BGE-M3 向量化，需 NVIDIA GPU + nvidia-container-toolkit，约 2.2G 权重）
#   --profile es    → Elasticsearch（RAG 关键词检索路，当前未使用，默认关闭以省内存）
#
# 示例：
#   只启推荐链路所需中间件        docker compose --profile rec up -d
#   启 RAG 向量检索               docker compose --profile rag --profile gpu up -d
#   启全部                        docker compose --profile rec --profile rag --profile gpu --profile es up -d
#
# 后端 Spring Boot 保持本地运行；根目录 .env 提供 REDIS_PASSWORD、BGE_M3_MODEL_PATH 等（已 gitignore）
# 说明：编排细节见 docs/README.md；设计稿已归档不随仓库分发
services:
  # ====== Redis（仅本机可达，含密码）======
  redis:
    image: redis:8.8-alpine              # 锁精确小版本，与本地 redis-8.8.0 对齐
    container_name: shop-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"            # 仅本机可达，局域网不暴露
    command: >
      redis-server --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      # 用 REDISCLI_AUTH 环境变量替代 -a 命令行参数，避免密码暴露在进程命令行中
      test: ["CMD", "sh", "-c", "REDISCLI_AUTH=$REDIS_PASSWORD redis-cli ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ====== Qdrant（向量库，空库启动，collection 由后端启动时自动构建）======
  qdrant:
    image: qdrant/qdrant
    container_name: shop-qdrant
    restart: unless-stopped
    # 归入 rag profile：仅在需要 RAG 向量检索时启动，默认不随 up 启动（省内存）
    # 启用：docker compose --profile rag up -d
    profiles: ["rag"]
    ports:
      - "127.0.0.1:6333:6333"            # REST API，仅本机可达（后端 ProductIndexer / RagSearchService 使用）
      - "127.0.0.1:6334:6334"            # gRPC，仅本机可达（langchain4j QdrantEmbeddingStore 使用）
    volumes:
      - qdrant-data:/qdrant/storage

  # ====== TEI（文本向量化：本地 BGE-M3，1024 维；后端 RAG 向量路依赖）======
  # 前置：宿主机需 NVIDIA GPU + nvidia-container-toolkit（下方 gpus 依赖它）。
  # 无 GPU 机器：改用 cpu-1.7 镜像并删掉 gpus 一行（CPU 推理慢，仅够开发自测）。
  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:1.7
    container_name: shop-tei
    restart: unless-stopped
    # 归入 gpu profile：默认 up 不启动它，避免无 GPU 机器上「第一步就失败」。
    # 启用：docker compose --profile gpu up -d（只起 TEI 亦可：--profile gpu up -d tei）
    profiles: ["gpu"]
    gpus: all                            # 等价 docker run --gpus all；需 nvidia-container-toolkit
    ports:
      - "127.0.0.1:9090:80"              # 宿主 9090 → 容器 80（TEI 默认端口）；⚠️ 不可用 8080（被后端 server.port 占用）
    volumes:
      # 模型权重目录（.env 的 BGE_M3_MODEL_PATH，默认 D:/models/bge-m3，约 2.2G）
      # :ro 只读 —— 防止容器回写权重；⚠️ 目录缺失时 Docker 会建空目录，TEI 将启动失败
      - "${BGE_M3_MODEL_PATH:-D:/models/bge-m3}:/data/BAAI/bge-m3:ro"
    environment:
      - HF_HOME=/data
      - HUGGINGFACE_HUB_CACHE=/data
      - HF_ENDPOINT=https://hf-mirror.com   # 国内镜像；离线环境避免卡在联网校验
    # ⚠️ --model-id 必须是【容器内绝对路径】：写成模型名（BAAI/bge-m3）时 TEI 会强制联网
    #    拉取 1_Pooling/config.json 并卡死；--pooling cls 显式指定池化，省去该次探测。
    command: --model-id /data/BAAI/bge-m3 --pooling cls
    healthcheck:
      # TEI 镜像自带 curl；/health 就绪后才真正可用（后端重建索引前务必确认）
      test: ["CMD-SHELL", "curl -fs http://localhost:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s                  # 首次加载 2.2G 权重到 GPU 需要时间

  # ====== Elasticsearch（关键词检索路，内置 IK 中文分词；镜像由 docker/elasticsearch/Dockerfile 构建）======
  elasticsearch:
    build:
      context: ./docker/elasticsearch
    image: shop-elasticsearch:8.11.4     # 构建产物打本地标签：up -d 命中即复用，不会每次重建
    container_name: shop-es
    restart: unless-stopped
    # 归入 es profile：当前 RAG 关键词检索未使用，默认关闭以省内存（约 1GB 堆 + 系统开销）
    # 启用：docker compose --profile es up -d
    profiles: ["es"]
    ports:
      - "127.0.0.1:9200:9200"            # REST API，仅本机可达（后端 ES 关键词检索使用）
    environment:
      - discovery.type=single-node       # 单节点模式，免集群发现配置（本地开发）
      - xpack.security.enabled=false     # 关闭鉴权/证书；靠端口只绑 127.0.0.1 兜底，切勿在公网机器套用
      - bootstrap.memory_lock=true       # 禁止堆换出，需配合下方 memlock ulimit
      - ES_JAVA_OPTS=-Xms512m -Xmx512m   # ES 默认吃宿主一半内存，本机内存有限故显式锁 512m 堆
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es-data:/usr/share/elasticsearch/data
      # 功能编号 001：IK 自定义词典（plugins/analysis-ik/config/my_dict.dic）当前**未挂载**，
      # 容器重建后词典会丢失。首版不依赖自定义词典；需要时补一行：
      #   - ./docker/elasticsearch/ik-config:/usr/share/elasticsearch/plugins/analysis-ik/config:ro
      # 并重启容器（词典热更新另见 IKAnalyzer.cfg.xml 的 remote_ext_dict）
    healthcheck:
      # 镜像自带 curl；单节点副本分片必然 unassigned，故 yellow 即视为可用
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null || exit 1"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 60s

  # ====== RocketMQ NameServer ======
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.2
    container_name: shop-rmq-namesrv
    restart: unless-stopped
    # named volume 默认 root:root，而镜像 USER=rocketmq 无法写入日志卷，故以 root 运行
    user: root
    ports:
      - "127.0.0.1:9876:9876"            # 仅本机可达
    volumes:
      - rmq-logs:/home/rocketmq/logs
    # 官方 entrypoint 按参数区分角色：nameserver → exec ./mqnamesrv
    command: nameserver

  # ====== RocketMQ Broker（Remoting 直连 10911，不启用 proxy）======
  rocketmq-broker:
    image: apache/rocketmq:5.3.2
    container_name: shop-rmq-broker
    restart: unless-stopped
    # named volume 默认 root:root，而镜像 USER=rocketmq 无法写入 store/logs 卷，故以 root 运行
    user: root
    ports:
      - "127.0.0.1:10909:10909"          # 仅本机可达
      - "127.0.0.1:10911:10911"          # 仅本机可达（后端 Remoting 直连）
      - "127.0.0.1:10912:10912"          # 仅本机可达
    volumes:
      - rmq-logs:/home/rocketmq/logs
      - rmq-store:/home/rocketmq/store
      # 注意：挂载路径含镜像版本号，升级镜像需同步修改
      - ./docker/rocketmq/broker.conf:/home/rocketmq/rocketmq-5.3.2/conf/broker.conf:ro
    environment:
      - JAVA_OPT_EXT=-server -Xms256m -Xmx512m -XX:+UseG1GC
    # 官方 entrypoint 按参数区分角色：broker → exec ./mqbroker
    # -n 指向 compose 网络内 namesrv 的【服务名】rocketmq-namesrv（用 namesrv 会 DNS 解析失败）
    command: broker -n rocketmq-namesrv:9876 -c /home/rocketmq/rocketmq-5.3.2/conf/broker.conf
    depends_on:
      - rocketmq-namesrv

  # ====== Kafka（推荐子系统行为事件流，KRaft 单节点，无 ZooKeeper）======
  # 说明：推荐链路使用 Kafka（对事件时间语义与 Flink 集成更成熟），
  #       商城原有订单/消息链路继续使用 RocketMQ，两套并存互不影响。
  # 归入 rec profile：需要推荐链路时显式启动 —— docker compose --profile rec up -d
  kafka:
    image: apache/kafka:3.7.0
    container_name: shop-kafka
    restart: unless-stopped
    profiles: ["rec"]
    ports:
      - "127.0.0.1:9092:9092"            # 仅本机可达：客户端（商城后端）跑在宿主机
    environment:
      # KRaft 单节点：同一进程同时承担 controller 与 broker 角色
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # 双 listener（必须）：advertised 地址会被回传给客户端，单值无法同时服务两类调用方。
      #   EXTERNAL 9092 → 宿主机客户端（商城后端、Flink 作业），通告为 127.0.0.1:9092
      #   INTERNAL 9093 → compose 网络内客户端（kafka-init、将来的容器化 Flink），通告为 kafka:9093
      # 若只配单 listener，容器内客户端连上后会拿到 127.0.0.1:9092（指向它自己）而连接失败。
      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:9093,CONTROLLER://:9094
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://127.0.0.1:9092,INTERNAL://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      # 单节点：副本因子统一为 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      # 开发便利：允许自动创建主题，默认 3 分区（与 Flink 并行度对齐）
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: true
      KAFKA_NUM_PARTITIONS: 3
      # 保留策略兜底值：具体主题在 kafka-init 中单独指定（行为 7 天 / 商品变更 3 天）
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824   # 日志段 1GB
    volumes:
      - kafka-data:/opt/kafka/data

  # ====== Kafka 主题初始化（一次性容器，幂等：--if-not-exists）======
  # 主题约定见《详细设计说明书》4.3：user-behavior 3 分区 / 保留 7 天，item-change 1 分区 / 保留 3 天
  kafka-init:
    image: apache/kafka:3.7.0
    container_name: shop-kafka-init
    profiles: ["rec"]
    depends_on:
      - kafka
    entrypoint: [ "/bin/bash", "-c" ]
    command:
      - |
        set -e
        KAFKA_BIN=/opt/kafka/bin
        # 容器内客户端走 INTERNAL listener（通告地址为 kafka:9093）
        BOOTSTRAP=kafka:9093
        echo "等待 Kafka 就绪..."
        for i in $$(seq 1 30); do
          if $$KAFKA_BIN/kafka-topics.sh --bootstrap-server $$BOOTSTRAP --list >/dev/null 2>&1; then
            echo "Kafka 已就绪"; break
          fi
          sleep 2
        done
        $$KAFKA_BIN/kafka-topics.sh --bootstrap-server $$BOOTSTRAP --create --if-not-exists \
          --topic user-behavior --partitions 3 --replication-factor 1 --config retention.ms=604800000
        $$KAFKA_BIN/kafka-topics.sh --bootstrap-server $$BOOTSTRAP --create --if-not-exists \
          --topic item-change --partitions 1 --replication-factor 1 --config retention.ms=259200000
        echo "当前主题列表："
        $$KAFKA_BIN/kafka-topics.sh --bootstrap-server $$BOOTSTRAP --list
    restart: "no"

  # ====== Flink 集群（推荐子系统实时特征计算作业 M-02 与商品热度算子 M-04）======
  # 说明：作业以独立工程 shop-rec-flink（编译目标 Java 11）打包后提交至本集群；
  #       内存按单机 16GB 约束收敛（JM 1G + TM 2G），并行度与槽位均取 3（与 Kafka 分区数对齐）。
  # 归属 rec profile：docker compose --profile rec up -d
  flink-jobmanager:
    image: flink:1.17.2
    container_name: shop-flink-jm
    restart: unless-stopped
    profiles: ["rec"]
    # named volume 默认 root:root，而镜像 USER=flink 无法写入检查点卷，故以 root 运行
    user: root
    ports:
      - "127.0.0.1:8081:8081"            # 作业管理界面，仅本机可达
      - "127.0.0.1:6123:6123"            # JobManager RPC，供作业提交使用，仅本机可达
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 1024m
        taskmanager.numberOfTaskSlots: 3
        parallelism.default: 3
        state.backend: rocksdb
        state.checkpoints.dir: file:///opt/flink/checkpoints
        execution.checkpointing.interval: 60s
        execution.checkpointing.mode: EXACTLY_ONCE
        execution.checkpointing.min-pause: 30s
    # 检查点目录不挂载 named volume：实测 Docker Desktop 的 named volume 与 Flink
    # LocalFileSystem 交互异常（JobManager 创建 {jobId}/shared 目录失败，而手工 mkdir 正常）。
    # 容器内路径可正常工作，检查点随容器生命周期存在——容器不销毁即可正常恢复；
    # 若需跨容器重建持久化，改用宿主机目录 bind mount 并把作业参数 checkpoint.storage 指向该路径。

  flink-taskmanager:
    image: flink:1.17.2
    container_name: shop-flink-tm
    restart: unless-stopped
    profiles: ["rec"]
    # 同 JobManager：需写入检查点卷，故以 root 运行
    user: root
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.memory.process.size: 2048m
        taskmanager.numberOfTaskSlots: 3
        parallelism.default: 3
        state.backend: rocksdb
        state.checkpoints.dir: file:///opt/flink/checkpoints

  # ====== Nginx（静态三端 + 反代后端，容器内经 host.docker.internal 访问宿主机 :8080）======
  nginx:
    image: nginx:1.20.2-alpine
    container_name: shop-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      # Docker 版主配置（覆盖容器默认 nginx.conf；含 http 块，upstream/gzip 合法）
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # 三端静态资源挂载（:ro 只读；npm run build 后挂载卷实时同步，无需重建容器）
      - ./frontend/dist:/usr/share/nginx/html/user:ro
      - ./frontend-admin/dist:/usr/share/nginx/html/admin:ro
      - ./frontend-merchant/dist:/usr/share/nginx/html/merchant:ro
      # 商品图片上传目录：后端（宿主机进程）写入，Nginx 只读提供
      # ⚠️ 必须与 application.yml 的 app.upload.dir 指向同一宿主机目录，否则上传成功但访问 404
      - ./uploads:/usr/share/nginx/html/uploads:ro
    depends_on:
      - redis

volumes:
  redis-data: {}
  qdrant-data: {}
  es-data: {}
  rmq-logs: {}
  rmq-store: {}
  kafka-data: {}
