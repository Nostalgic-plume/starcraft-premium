spring:
  application:
    name: shop

  datasource:
    url: jdbc:mysql://localhost:3306/shop?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  web:
    resources:
      add-mappings: false            # 关闭默认静态资源映射（Nginx 托管前端静态文件）
  mvc:
    throw-exception-if-no-handler-found: true   # 无匹配 Handler 时抛异常而非回退到静态资源

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.shop.model.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8080

sa-token:
  token-name: token
  # 会话存储介质：memory=JVM 内存（默认，单机可用）；redis=Redis 存储（分布式会话共享，
  # 多实例部署时登录态/强制下线跨实例生效；序列化走 sa-token-jackson，对象以 JSON 存 String 键）
  dao-type: redis
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false

# RocketMQ 配置（NameServer 地址由 .env 传入，默认本地 9876）
rocketmq:
  name-server: ${ROCKETMQ_NAMESRV:127.0.0.1:9876}
  producer:
    group: shop-producer-group

rag:
  qdrant:
    host: localhost
    port: 6334
    collection-name: products
    dimension: 1536
  llm:
    api-key: ${DASHSCOPE_API_KEY}
    chat-model: qwen-plus
    embedding-model: text-embedding-v1
