# Shop 电商系统 Nginx 配置（三端合一）
#
# 用户端   → http://localhost:8088
# 管理后台 → http://localhost:8088/admin/
# 商家中心  → http://localhost:8088/merchant/
# API      → http://localhost:8088/api/* → localhost:8080
#
# 启动命令（在项目根目录执行）：
#   deploy\nginx.exe -c deploy/nginx.conf -p .
# 或直接双击 deploy\start.bat

worker_processes  1;

error_log  logs/error.log;

events {
    worker_connections  1024;
}

http {
    include       "D:/claudecode/shop/deploy/mime.types";
    default_type  application/octet-stream;

    charset       utf-8;
    sendfile      off;
    keepalive_timeout  65;

    # 客户端请求体缓存（防 413 Request Entity Too Large）
    client_body_temp_path  temp/client_body_temp;
    proxy_temp_path        temp/proxy_temp;
    fastcgi_temp_path      temp/fastcgi_temp;
    uwsgi_temp_path        temp/uwsgi_temp;
    scgi_temp_path         temp/scgi_temp;
    client_max_body_size   10m;

    server {
        listen       8088;
        server_name  localhost;

        # ====== 用户端 ======
        location / {
            root      "D:/claudecode/shop/deploy/html/user";
            index     index.html;
            try_files $uri $uri/ /index.html;
        }

        # 用户端静态资源（30天缓存）
        location ~* ^/assets/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
            root      "D:/claudecode/shop/deploy/html/user";
            expires   30d;
            add_header Cache-Control "public, immutable";
            log_not_found off;
        }

        # ====== 管理后台 ======
        location /admin/ {
            alias     "D:/claudecode/shop/deploy/html/admin/";
            index     index.html;
            try_files $uri $uri/ /admin/index.html;
        }

        # 管理后台静态资源（30天缓存）
        location ~* ^/admin/assets/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
            root      "D:/claudecode/shop/deploy/html";
            expires   30d;
            add_header Cache-Control "public, immutable";
            log_not_found off;
        }

        # ====== 商家中心 ======
        location /merchant/ {
            alias     "D:/claudecode/shop/deploy/html/merchant/";
            index     index.html;
            try_files $uri $uri/ /merchant/index.html;
        }

        # 商家中心静态资源（30天缓存）
        location ~* ^/merchant/assets/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
            root      "D:/claudecode/shop/deploy/html";
            expires   30d;
            add_header Cache-Control "public, immutable";
            log_not_found off;
        }

        # ====== 数据看板 API → Spring Boot（8080） ======
        location /api/dashboard/ {
            proxy_pass http://localhost:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ====== 智能客服 SSE 流式接口 → Spring Boot（8080） ======
        # 与 docker/nginx/nginx.conf 保持一致：SSE 关缓冲/关压缩，读超时放宽到 300s
        # （/api/ 默认 60s，模型侧挂起超时会断流，前端报「读取中断: network error」）
        location = /api/chat/ask {
            proxy_pass http://localhost:8080;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ====== API 反向代理 → Spring Boot（8080） ======
        location /api/ {
            proxy_pass http://localhost:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ====== Swagger 文档 ======
        location /swagger-ui.html { proxy_pass http://localhost:8080; }
        location /api-docs          { proxy_pass http://localhost:8080; }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root "D:/claudecode/shop/deploy/html";
        }
    }
}
