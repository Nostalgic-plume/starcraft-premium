spring:
  application:
    name: shop

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    url: jdbc:mysql://localhost:3306/shop?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      # 连接池参数
      initial-size: 5                 # 启动预建连接
      min-idle: 5                     # 最小空闲连接
      max-active: 20                  # 最大连接数（并发 SQL 上限，防打垮数据库）
      max-wait: 60000                 # 借连接最长等待 60s，超时抛异常
      # 连接保活检测
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      # 监控过滤器
      filter:
        stat:                          # SQL 统计：参数化指纹聚合 + 慢 SQL 日志
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 2000        # 超过 2s 的 SQL 打印 WARN 日志
        wall:                          # SQL 防火墙：解析 AST 拦截 1=1 注入 / 无 WHERE 删除等
          enabled: true
      # 监控面板（访问 /druid/）
      stat-view-servlet:
        enabled: true
        login-username: ${DRUID_MONITOR_USER:admin}
        login-password: ${DRUID_MONITOR_PASSWORD}   # 必须通过 .env 注入，无默认值（未配置则启动失败，防呆）
        reset-enable: false            # 禁止在面板上清空统计数据
      # Web 请求统计
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"

  data:
    redis:
      # 必须写 IPv4 字面量：Docker 只把 Redis 映射到 127.0.0.1，而 JDK 会把 localhost
      # 优先解析为 IPv6 ::1，Lettuce 连 ::1:6379 直到 3 秒超时才失败，
      # 表现为「Redis 明明在跑、应用却报 Unable to connect to localhost/<unresolved>:6379」
      host: ${REDIS_HOST:127.0.0.1}
      port: 6379
      database: 0
      timeout: 3000ms
      password: ${REDIS_PASSWORD:}

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  web:
    resources:
      add-mappings: false            # 关闭默认静态资源映射（Nginx 托管前端静态文件）
  mvc:
    throw-exception-if-no-handler-found: true   # 无匹配 Handler 时抛异常而非回退到静态资源

  # 文件上传大小限制：Spring 默认单文件仅 1MB，不显式配置会导致稍大的图片被拒且报错晦涩
  # （Nginx 侧 client_max_body_size 20m 为外层兜底，实际取二者较小值生效）
  servlet:
    multipart:
      max-file-size: 5MB            # 单文件上限
      max-request-size: 10MB        # 单次请求总量（多图同时上传时）

# 推荐库数据源（个性化推荐子系统专用）
# 与商城业务库物理分离：推荐服务对推荐库读写，对商城业务库只读。
# 单机部署下与商城库共用同一 MySQL 实例；账号密码支持独立环境变量注入（未设置时回退到商城库账号），
# 生产环境建议为推荐库单独配置读写账号，防止越权访问商城业务数据。
rec:
  datasource:
    url: jdbc:mysql://localhost:3306/shop_rec?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${REC_DB_USERNAME:${DB_USERNAME:root}}
    password: ${REC_DB_PASSWORD:${DB_PASSWORD}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    initial-size: 2                 # 推荐库并发量低于商城库，连接池规模相应收敛
    min-idle: 2
    max-active: 10
    max-wait: 60000
    validation-query: SELECT 1
    test-while-idle: true
    test-on-borrow: false
    test-on-return: false

  # 消息队列（推荐子系统行为事件流）
  # 说明：推荐链路使用 Kafka，商城原有订单/消息链路继续使用 RocketMQ，两套并存互不影响。
  # 生产端由商城后端（M-01 行为采集）使用；消费端在独立 Flink 作业中，不在本工程。
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    user-behavior-topic: user-behavior
    delivery-timeout-ms: 50        # 单条事件投递超时（毫秒），对应详细设计 3.1 步骤 8
    retries: 3                     # 生产者重试次数，对应详细设计 3.1「重试 3 次」

  # 推荐服务调用参数（商城后端作为唯一调用方）
  # internal-token 必须与推荐服务侧的 rec.internal-token 一致，双方均从环境变量注入；
  # 未配置时推荐服务会拒绝内部调用，首页榜单自动降级为商城原生热销榜。
  proxy:
    base-url: ${REC_SERVICE_URL:http://127.0.0.1:8082}
    internal-token: ${REC_INTERNAL_TOKEN:}
    timeout-millis: 1000           # 比推荐服务自身 800ms 预算略宽，留出网络与序列化开销

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.shop.model.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8080

sa-token:
  token-name: token
  # 关闭 cookie 读写：三端均为 SPA，token 走请求头、存于各端独立的 localStorage。
  # 开启 cookie 会因「同源共享 cookie」导致三端会话串扰——例如商家端登录种下的 token cookie，
  # 会让用户端/未登录游客的请求被识别为商家会话，误触发 ShopDataIsolationInterceptor。
  # 且前端「退出登录」只清 localStorage，不会清 cookie，残留 cookie 会长期污染游客态。
  is-read-cookie: false
  is-write-cookie: false
  # 会话存储介质：memory=JVM 内存（默认，单机可用）；redis=Redis 存储（分布式会话共享，
  # 多实例部署时登录态/强制下线跨实例生效；序列化走 sa-token-jackson，对象以 JSON 存 String 键）
  dao-type: redis
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false

# RocketMQ 配置（NameServer 地址由 .env 传入，默认本地 9876）
rocketmq:
  name-server: ${ROCKETMQ_NAMESRV:127.0.0.1:9876}
  producer:
    group: shop-producer-group

rag:
  # 智能客服 SSE 心跳（秒）：长回答/模型思考期定期下发 ping 帧，防代理判空闲断流；≤0 关闭
  chat:
    heartbeat-seconds: 15
  qdrant:
    host: localhost
    port: 6334
    collection-name: products
    # 向量维度：BGE-M3 为 1024（原 DashScope text-embedding-v1 为 1536）
    # 全链路唯一事实来源——建集合（QdrantCollectionHelper）与查询向量自检（RagSearchService）都读此值
    dimension: 1024
  search:
    # 向量路相关性门槛：与 embedding 模型**强相关**，换模型（如 BGE-M3 → 其他）后必须重估。
    # 外置前是 RagSearchService 的类常量，换模型会导致召回质量静默劣化且无任何告警。
    min-relevance-score: 0.3
    # 候选池 = topK × multiplier，再收敛到 [min-query-limit, max-query-limit]
    # 与 rag.rrf 权重同属检索调优旋钮，口径保持一致（均外置）
    candidate-multiplier: 5
    min-query-limit: 50
    max-query-limit: 200
    # 公开接口未校验 topK，超大值会放大下游 LIMIT 与 Qdrant maxResults
    max-top-k: 100
    # 向量路开关（仅作用于智能客服链路）
    # true  = 客服走「向量 + 关键词」双路加权 RRF 融合（需部署 Qdrant + TEI）
    # false = 客服退化为纯关键词路（ES，故障回退 MySQL FULLTEXT）
    # 注意：公开商品检索（/api/product/rag-search）不受此开关影响，固定只走关键词路，
    #       见 RagSearchService.search() 的注释
    vector-enabled: true
  # 关键词路 Elasticsearch（功能编号 001，设计见 docs/specs/001-es-keyword-search）
  # ES 为关键词路首选，故障时 Router 自动回退 MySQL FULLTEXT —— 不需要为故障改这里的开关。
  # enabled=false 是「整体回滚到 MySQL FULLTEXT」的开关，与故障降级是两回事。
  # 服务端版本必须与 pom 的 elasticsearch.version 一致（8.11.4，含 IK 分词器）。
  elasticsearch:
    enabled: true
    scheme: http
    host: localhost
    port: 9200
    index-name: shop_products
    # 超时刻意偏短：ES 故障必须快速回退，不能拖慢整条 RAG 检索
    connect-timeout-ms: 500
    socket-timeout-ms: 1500
    # 熔断后多久半开重试一次；同时作为「ES 晚启动/索引为空」的自愈检查间隔
    recovery-interval-ms: 30000
    bulk-batch-size: 200
    # 匹配门槛（ES 条件语法）。置空 = 纯 OR（当前默认）。
    # 2026-10-21 实测：OR / 2<70% / 100% 的 Hit@3 分别为 0.973 / 0.892 / 0.946，
    # 提高门槛会误伤「轻薄本」这类简称查询，故不启用。详见 evaluation-2026-10-21.md §4.2
    # 长句被泛化词带偏的问题（「办公笔记本电脑」召回办公椅）改由「最长词加权」处理，
    # 见 EsKeywordSearchService#LONGEST_TERM_BOOST，与本配置项互不影响。
    minimum-should-match: ""
  reconcile:
    # 向量索引对账：发现并修复「索引更新失败 → 商品永久搜不到 / 搜到旧内容」的不一致。
    # ⚠️ 升级后（payload 新增 updateTime）先手动重建一次索引，否则存量索引会被判为陈旧
    #    且因差异过大被阈值拦截（见 docs/rag-index-reconcile-design.md §六.1）
    enabled: true
    fixed-rate-ms: 1800000          # 30 分钟
    max-auto-fix-ratio: 0.2         # 差异超过 20% 只告警不自动修复
    scroll-batch-size: 256
  llm:
    # 每个键都带「:」默认值：绑定期取不到值时宁可落到默认值，也不要让上下文启动失败
    # （唯一 @SpringBootTest RagEvaluationTest 会因此起不来）
    api-key: ${DASHSCOPE_API_KEY:}          # 保留仅作回滚用，embedding / backup 已不再引用
    # 对话模型 key：优先 DEEPSEEK_API_KEY，未配回退 rag.llm.api-key
    chat-api-key: ${DEEPSEEK_API_KEY:${rag.llm.api-key}}
    chat-model: deepseek-chat
    # 向量化：本地 TEI 容器挂载的 BAAI/bge-m3 完整版权重（OpenAI 兼容 /v1/embeddings，1024 维）
    # 命名刻意用通用的 EMBEDDING_*：底层换成 Ollama / 其他 OpenAI 兼容服务只改这一个 URL，不改代码
    # ⚠️ 端口避开 8080（server.port）与 9080（被 NahimicService 占用）
    embedding-base-url: ${EMBEDDING_BASE_URL:http://localhost:9090/v1}
    embedding-api-key: ${EMBEDDING_API_KEY:dummy}   # TEI 不校验鉴权，但 SDK 要求非空
    embedding-model: ${EMBEDDING_MODEL:bge-m3}
    # 备用对话模型：智谱 glm-4-flash（与主模型 DeepSeek 异构，保留容灾语义）
    backup-base-url: ${BACKUP_LLM_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
    backup-api-key: ${BACKUP_LLM_API_KEY:}
    backup-model: ${BACKUP_LLM_MODEL:glm-4-flash}
  # 领域同义词表（组内词互为同义词）：仅用于关键词路扩展，提升口语化用词的召回
  # enabled=false 可关闭扩展，用于评估 baseline 对比或线上回滚
  synonym:
    enabled: true
    groups:
      - ["充电宝", "移动电源", "充电电池"]
      - ["刮胡刀", "剃须刀", "电动剃须刀"]
      - ["球鞋", "运动鞋", "跑鞋", "跑步鞋"]
      - ["充电头", "快充头", "充电器"]
      - ["笔记本电脑", "游戏本", "轻薄本"]
    # 错别字纠正（**单向**：错 → 对，不会反向污染正确词）。
    # 背景：IK 把「手鸡」切成「手」「鸡」单字，纯 OR 命中「手口湿巾」；ngram 则 0 命中。
    # 人工兜底，覆盖有限；系统性方案（拼音/编辑距离纠错）另立专项（evaluation-2026-10-21.md §4.3）
    # 格式与 groups 同构：每组首个是错词，其余是纠正结果。
    # 不用 Map 是因为 Spring Boot 的 ConfigurationPropertyName 不接受中文 key（实测绑定期报错）
    corrections:
      - ["手鸡", "手机"]
      - ["洗依机", "洗衣机"]
  # RRF 融合参数：默认两路等权 1.0/1.0、k=60（与改造前行为完全一致，可随时回滚）
  # 调高 weight-keyword 会提高关键词路话语权：对字面匹配强的 query 有利，但会压制语义类 query
  rrf:
    k: 60
    weight-vector: 1.0
    # 2026-10-21 由 2.0 回调至 1.5（功能编号 001 评估集实测，见 docs/specs/001-es-keyword-search/evaluation-2026-10-21.md §3.4）：
    # 旧档 2.0 在新数据 + ES 关键词路上 MRR=0.959，1.0/1.5 均为 0.973。
    # 2.0 会放大 ES `operator: OR` 的宽泛匹配，压制向量路语义结果；1.5 保留关键词话语权且不损排序。
    weight-keyword: 1.5

# 本地文件存储（商品图片上传）
# 定位：单机/演示方案。生产环境应替换为对象存储，接口契约保持一致，仅换 FileStorageService 实现
# （见 docs/image-upload-design.md）。dir 与 Nginx 容器挂载点必须指向同一宿主机目录。
app:
  upload:
    dir: ./uploads          # 落盘根目录（相对后端进程工作目录；本项目工作目录为仓库根）
    url-prefix: /uploads    # 对外访问前缀（Nginx 映射同一目录为静态资源）
